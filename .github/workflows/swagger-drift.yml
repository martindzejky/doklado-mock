name: swagger-drift

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24 strips types so the .ts script runs without pnpm.
          node-version: 24
      # Byte comparison on purpose. New endpoints the mock does not implement
      # still fail the job so someone reviews them against BEHAVIOUR.md.
      - run: node scripts/check-swagger-drift.ts
